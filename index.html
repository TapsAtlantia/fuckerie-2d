<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>fuckerie 2d — Phase 1</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070d; }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
        cursor: crosshair;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        font: 12px/1.45 ui-monospace, "Cascadia Code", Consolas, monospace;
        color: #d8e0f0;
        text-shadow: 0 1px 2px #000, 0 0 2px #000;
        pointer-events: none;
        white-space: pre;
        user-select: none;
      }
      #help {
        position: fixed;
        bottom: 8px;
        left: 8px;
        font: 11px/1.5 ui-monospace, Consolas, monospace;
        color: #8b97b3;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
        user-select: none;
      }
      #game:focus { outline: none; }

      /* ---- Menu overlay (home / profile / multiplayer) ---- */
      #menu {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(120% 90% at 50% 0%, #101a2c 0%, #070b13 55%, #04060b 100%);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #dbe3f4;
      }
      #menu .panel {
        width: min(92vw, 380px);
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 28px 26px;
        background: rgba(15, 21, 34, 0.72);
        border: 1px solid rgba(120, 160, 220, 0.16);
        border-radius: 16px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(8px);
      }
      #menu .brand {
        font-size: clamp(38px, 9vw, 54px);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 0.95;
        text-transform: lowercase;
        margin-bottom: -4px;
      }
      #menu .brand em {
        font-style: italic;
        color: #6cc4ff;
        text-shadow: 0 0 22px rgba(108, 196, 255, 0.4);
      }
      #menu .tagline { color: #8ea2c4; font-size: 13.5px; margin-top: -6px; }
      #menu h2 { font-size: 20px; font-weight: 700; }
      #menu .who { font-size: 13px; color: #9fb0cf; }
      #menu .who b { font-weight: 700; }
      #menu .link {
        background: none; border: none; color: #6cc4ff; cursor: pointer;
        font: inherit; text-decoration: underline; padding: 0 2px;
      }
      #menu .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
      #menu .actions.row { flex-direction: row; }
      #menu .actions.row .btn { flex: 1; }
      #menu .btn {
        appearance: none; cursor: pointer;
        padding: 12px 16px; border-radius: 10px;
        border: 1px solid rgba(140, 170, 220, 0.22);
        background: rgba(255, 255, 255, 0.04);
        color: #e6ecfa; font: 600 15px "Segoe UI", system-ui, sans-serif;
        transition: transform 0.06s ease, background 0.15s ease, border-color 0.15s ease;
      }
      #menu .btn:hover { background: rgba(255, 255, 255, 0.09); border-color: rgba(140, 170, 220, 0.4); }
      #menu .btn:active { transform: translateY(1px); }
      #menu .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      #menu .btn.primary {
        background: linear-gradient(180deg, #4aa8f0, #2f7fd6);
        border-color: #2f7fd6; color: #04121f;
      }
      #menu .btn.primary:hover { background: linear-gradient(180deg, #5cb4f7, #368be0); }
      #menu .btn.ghost { background: transparent; }
      #menu .btn.small { padding: 8px 12px; font-size: 13px; }
      #menu .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #9fb0cf; }
      #menu .field input {
        padding: 11px 12px; border-radius: 10px;
        border: 1px solid rgba(140, 170, 220, 0.25);
        background: rgba(0, 0, 0, 0.28); color: #eef3ff;
        font: 600 16px ui-monospace, Consolas, monospace; letter-spacing: 0.06em;
      }
      #menu .field input:focus { outline: 2px solid #6cc4ff; outline-offset: 0; border-color: transparent; }
      #menu .colors { display: flex; flex-wrap: wrap; gap: 8px; }
      #menu .swatch {
        width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
        border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
      }
      #menu .swatch.sel { border-color: #fff; box-shadow: 0 0 0 2px #6cc4ff; }
      #menu .status { font-size: 13px; color: #9fb0cf; min-height: 18px; line-height: 1.4; }
      #menu .status b { color: #ffd166; }
      #menu .hint { font-size: 12px; color: #7c8bab; }
      #menu .phase { font-size: 11px; color: #61708f; margin-top: 2px; }
      #menu .code-wrap { display: flex; align-items: center; gap: 10px; }
      #menu .code-wrap.hidden { display: none; }
      #menu .code {
        flex: 1; text-align: center; padding: 12px;
        font: 800 30px ui-monospace, Consolas, monospace; letter-spacing: 0.32em;
        color: #7ee787; background: rgba(0,0,0,0.3); border-radius: 10px;
        border: 1px dashed rgba(126, 231, 135, 0.4); padding-left: 0.32em;
      }
      @media (prefers-reduced-motion: reduce) {
        #menu .btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="menu"></div>
    <div id="hud"></div>
    <div id="help">
      WASD/Arrows move · Space jump · L-click mine · R-click place · 1-4 select block ·
      F fly · T warp down 2000 · Y warp up 2000 · G regen seed
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
